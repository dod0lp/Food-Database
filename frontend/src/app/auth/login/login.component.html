<section class="card">
  <h1>Sign in</h1>
  <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)" novalidate>

    <label>Email
      <input #emailControl="ngModel" name="email"
        type="email" email autocomplete="email"
        [(ngModel)]="email" required>

      @if (emailControl.invalid && (emailControl.touched || submitted)) {
        <small class="field-error">
          @if (emailControl.errors?.['required']) { Enter your email address. }
          @else { Enter a valid email address. }
        </small>
      }
    </label>

    <label>Password
      <input #passwordControl="ngModel" name="password"
        type="password" autocomplete="current-password"
        [(ngModel)]="password" required>
      @if (passwordControl.invalid && (passwordControl.touched || submitted)) {
        <small class="field-error">Enter your password.</small>
      }
    </label>

    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
    
    <button type="submit" [disabled]="saving()">{{ saving() ? 'Signing in...' : 'Sign in' }}</button>
  </form>
  <p>New here? <a routerLink="/register">Create an account</a>.</p>
</section>
