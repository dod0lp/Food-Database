services:
  api:
    build:
      context: ./C#
      dockerfile: Api/Dockerfile
    env_file:
      - ./web/docker/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    expose:
      - "8080"
    volumes:
      - api_data_protection:/root/.aspnet/DataProtection-Keys

  web:
    build: ./web/angular
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  api_data_protection:
